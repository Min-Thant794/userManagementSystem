# Local load-test application; uses only the disposable E2E services.
spring.application.name=usermanagement-load
server.address=127.0.0.1
server.port=18080
spring.datasource.url=jdbc:postgresql://127.0.0.1:25432/usermanagement_e2e
spring.datasource.username=ums_e2e
spring.datasource.password=e2e_only
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-init-sql=SET statement_timeout TO '15s'
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.data.redis.host=127.0.0.1
spring.data.redis.port=26379
spring.data.redis.database=15
spring.data.redis.password=
spring.data.redis.timeout=3s
spring.data.redis.repositories.enabled=false

app.jwt.secret=load-only-secret-0123456789-0123456789-0123456789-0123456789
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000
app.cookie.secure=false
app.cors.allowed-origins=https://frontend.example
app.oauth2.frontend-redirect-uri=https://frontend.example/oauth2/callback
spring.jackson.deserialization.fail-on-unknown-properties=true

# Mail is captured locally by Mailpit.
spring.mail.host=127.0.0.1
spring.mail.port=11025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.from=no-reply@load.example
spring.mail.properties.mail.from=no-reply@load.example
app.mail.reset-password-base-url=https://frontend.example/reset
app.mail.verify-email-base-url=https://frontend.example/verify

# Satisfy production bean configuration. These services are not exercised.
cloudinary.cloud-name=unused-load-test
cloudinary.api-key=unused
cloudinary.api-secret=unused
spring.security.oauth2.client.registration.load.client-id=unused
spring.security.oauth2.client.registration.load.client-secret=unused
spring.security.oauth2.client.registration.load.provider=load
spring.security.oauth2.client.registration.load.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.load.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.load.scope=openid,profile,email
spring.security.oauth2.client.provider.load.authorization-uri=https://identity.example.invalid/authorize
spring.security.oauth2.client.provider.load.token-uri=https://identity.example.invalid/token
spring.security.oauth2.client.provider.load.user-info-uri=https://identity.example.invalid/userinfo
spring.security.oauth2.client.provider.load.jwk-set-uri=https://identity.example.invalid/jwks
spring.security.oauth2.client.provider.load.user-name-attribute=sub

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
