# HTTP server
server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# PostgreSQL
spring.datasource.url=${DATABASE_JDBC_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# Public frontend origin, without a trailing slash
app.cors.allowed-origins=${FRONTEND_ORIGIN}

# HTTPS cookies
app.cookie.secure=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# Email links
app.mail.reset-password-base-url=${FRONTEND_ORIGIN}/reset-password
app.mail.verify-email-base-url=${FRONTEND_ORIGIN}/verify-email

# Google login
app.oauth2.frontend-redirect-uri=${FRONTEND_ORIGIN}/oauth2/callback
spring.security.oauth2.client.registration.google.redirect-uri=${FRONTEND_ORIGIN}/login/oauth2/code/google

# Database management
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s