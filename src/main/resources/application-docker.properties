# Local Docker development only. application.properties is still loaded first.
server.address=0.0.0.0
server.port=8080

# Containers use Compose service names and internal ports.
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
spring.data.redis.host=redis
spring.data.redis.port=6379

# The local published endpoint uses HTTP. Hosting needs separate HTTPS settings.
app.cookie.secure=false
spring.jpa.show-sql=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
