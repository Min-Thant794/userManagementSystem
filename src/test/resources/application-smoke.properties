# Dedicated services from compose.integration.yml.
spring.datasource.url=jdbc:postgresql://127.0.0.1:15432/usermanagement_it
spring.datasource.username=ums_it
spring.datasource.password=integration_only
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-init-sql=SET statement_timeout TO '15s'

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.data.redis.host=127.0.0.1
spring.data.redis.port=16379
spring.data.redis.database=15
spring.data.redis.timeout=3s
spring.data.redis.repositories.enabled=false

# Dummy mail configuration; startup does not test SMTP connectivity.
spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.test-connection=false

# Dummy Cloudinary settings for constructing application beans.
cloudinary.cloud-name=context-test
cloudinary.api-key=12345
cloudinary.api-secret=context-test-only

# Test-only JWT configuration.
app.jwt.secret=application-smoke-only-secret-0123456789-0123456789-0123456789
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000

app.mail.reset-password-base-url=https://frontend.example/reset
app.mail.verify-email-base-url=https://frontend.example/verify
app.cookie.secure=true
app.cors.allowed-origins=https://frontend.example
app.oauth2.frontend-redirect-uri=https://frontend.example/oauth2/callback

# Explicit URLs avoid OAuth issuer discovery during startup.
spring.security.oauth2.client.registration.test.provider=test
spring.security.oauth2.client.registration.test.client-id=context-test
spring.security.oauth2.client.registration.test.client-secret=context-test-only
spring.security.oauth2.client.registration.test.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.test.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.test.scope=openid,email

spring.security.oauth2.client.provider.test.authorization-uri=https://oauth.example.invalid/authorize
spring.security.oauth2.client.provider.test.token-uri=https://oauth.example.invalid/token
spring.security.oauth2.client.provider.test.jwk-set-uri=https://oauth.example.invalid/jwks
spring.security.oauth2.client.provider.test.user-info-uri=https://oauth.example.invalid/userinfo
spring.security.oauth2.client.provider.test.user-name-attribute=sub

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
logging.level.root=WARN