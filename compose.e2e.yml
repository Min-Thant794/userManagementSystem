name: usermanagement-e2e
services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: usermanagement_e2e
      POSTGRES_USER: ums_e2e
      POSTGRES_PASSWORD: e2e_only
    ports:
      - "127.0.0.1:25432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ums_e2e -d usermanagement_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"
    environment:
      MP_MAX_MESSAGES: 200
